<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interim Planner</title>
    <style>
        #studentArea {
            display: grid;
            grid-template-columns: 200px repeat(5, 200px);
        }
        #facultyArea {
            display: grid;
            grid-template-columns: 300px auto;
        }
        .gridTable{
            display:grid;
            grid-template-columns: repeat(6, 200px);
            border: 1px solid red;
            margin: 5px;
        }
        .gridCell{
            border: 1px solid black;
            padding: 2px;
        }
    </style>
</head>
<body>
    Interim Plans
    <div id="headArea"></div>

    <div id ="facultyArea"></div>

    <div id="tableArea"></div>

    <div id = "sessionsArea">
        Session Name: <input type="text"  id="sessionName"><br>
        Faculty: <input type="text"  id="sessionFaculty"><br>
        Student Lead: <input type="text" id="sessionStudentLead">
        Location: <input type="text" id="sessionLocation">
        <input type="button" id="addSession" value="Add Session">
    </div>

</body>

<script>


    window.addEventListener("load", (event) => {
        //sendRequest("/", "getSessions", "all" );
        sendRequest("/", "collateSessions", "all" );
        addSessionButton();
    });

    studentIndex = 1;
    sessionsList = [];

        function addSessionButton(){
        let div = document.getElementById('addSession');
        let data = {
            "sessionName": document.getElementById("sessionName").value,
            "sessionFaculty": document.getElementById("sessionFaculty").value,
            "sessionStudentLead": document.getElementById("sessionStudentLead").value,
            "sessionLocation": document.getElementById("sessionLocation").value
        };
        div.addEventListener("click", function(){
            console.log("clicked");
            sendRequest("/", "addSession", data);
        })
    }

    



    function sendRequest(target, action, value="") {
        console.log("making request")
        let xR = new XMLHttpRequest();
        xR.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {
                
                console.log("Server Response:", this.responseText);
                data = JSON.parse(this.responseText);
                console.log("data:", data);
                console.log("data['item']:", data["item"]);
                
                //Handle responses
                if (data["item"] == "time") {
                    console.log("Got the time: ", data["status"]);
                    timeSlot.innerText = data["status"];
                }
                
                if (data["item"] == "students") {
                    // deviceTable.innerHTML = data['status'];
                    for (student of data["status"]){
                        console.log(student["studentName"]);
                        addStudentToList(student);
                    }
                }

                if (data["item"] == "assignments") {
                    // deviceTable.innerHTML = data['status'];
                    console.log("data[status]:", data["status"]);
                    console.log("isArray", Array.isArray(data["status"]))
                    let facDiv = document.getElementById("facultyArea");
                    for (let session in data["status"]){
                        let studentList = data["status"][session]
                        if (studentList.length > 0) {
                            //console.log(session, studentList);
                            let sesDiv = document.createElement("div");
                            sesDiv.innerHTML = session;
                            facDiv.appendChild(sesDiv);
                            let stuDiv = document.createElement("div");
                            stuDiv.innerText = studentList;
                            facDiv.appendChild(stuDiv);
                        }
                        
                    }
                    let sessionTable = "";
                    let tableDiv = document.getElementById("tableArea");
                    let currentSession = "";
                    for (let session in data["status"]){
                        let s = session.split("@");
                        let thing = s[0];
                        let d = s[1].split("_");
                        let thingDay = d[0];
                        let row = 0;
                        let col = 0;
                        switch (thingDay){
                            case 'Monday': 
                                col = 2;
                                break;
                            case "Tuesday":
                                col = 3;
                                break
                            case "Wednesday":
                                col = 4;
                                break
                            case "Thursday":
                                col = 5;
                                break
                            case "Friday":
                                col = 6;
                                break
                        }

                        let thingTime = d[1];
                        switch (thingTime){
                            case "AM": 
                                row = 2;
                                break;
                            case "PM": 
                                row = 3;
                                break;
                        }

                        if (currentSession !== thing){
                            currentSession = thing;
                        //table
                            console.log("making table ...")
                            sessionTable = document.createElement('div');
                            sessionTable.id = "sessionTable";
                            sessionTable.classList.add("gridTable");
                            tableDiv.appendChild(sessionTable);


                            let c = document.createElement("div");
                            c.innerHTML = thing;
                            sessionTable.appendChild(c);
                            c = document.createElement("div");
                            c.innerHTML = "Monday";
                            c.classList.add("gridCell");
                            sessionTable.appendChild(c);
                            c = document.createElement("div");
                            c.innerHTML = "Tuesday";
                            c.classList.add("gridCell");
                            sessionTable.appendChild(c);
                            c = document.createElement("div");
                            c.innerHTML = "Wednesday";
                            c.classList.add("gridCell");
                            sessionTable.appendChild(c);
                            c = document.createElement("div");
                            c.innerHTML = "Thursday";
                            c.classList.add("gridCell");
                            sessionTable.appendChild(c);
                            c = document.createElement("div");
                            c.innerHTML = "Friday";
                            c.classList.add("gridCell");
                            sessionTable.appendChild(c);

                            c = document.createElement("div");
                            c.innerHTML = "AM";
                            c.style.gridArea = `2 / 1`;
                            sessionTable.appendChild(c);

                            c = document.createElement("div");
                            c.innerHTML = "PM";
                            c.style.gridArea = `3 / 1`;
                            sessionTable.appendChild(c);

                        }
                        
                        //console.log("stuDiv:", thing, thingDay, `|${thingTime}|`, row, col);
                        let stuDiv = document.createElement("div");
                        stuDiv.innerHTML = data["status"][session].join(", ");
                        stuDiv.style.gridArea = `${row} / ${col}`;
                        stuDiv.classList.add("gridCell");
                        sessionTable.appendChild(stuDiv);

                    }

                    

                }

                if (data["item"] == "everything") {
                    // deviceTable.innerHTML = data['status'];
                    sessionsList = data['status']['sessions'];
                    for (student of data["status"]['students']){
                        console.log(student["studentName"]);
                        addStudentToList(student);
                    }
                }
            }
        }
        let data = {};
        data["action"] = action;
        data["value"] = value;
        console.log("data:", data);
        xR.open("POST", target, true);
        xR.send(JSON.stringify(data));
    }


</script>
</html>
